    <link rel="stylesheet" href="./assets/css/style.css">

<body>
    <h2 class="text-center bg-secondary p-3 text-white"> Post Crud Using Fetch And Firebase</h2>
    <div class="container-fluid mt-3">
        <div class="row">
           <div class="col-md-6 offset-3">
                <form id="post_form">
                <div class="card">
                    <div class="card-header bg-dark text-white">
                       <h3> Post Form</h3>
                    </div>
                    <div class="card-body content">
                       <div class="form-group">
                          <label for="title_control"> Title <strong class="text-danger">*</strong></label>
                          <input type="text" class="form-control" required autocomplete="off"  id="title_control">
                       </div>
                     
                       <div class="form-group">
                          <label for="content_control"> Content <strong class="text-danger">*</strong></label>
                          <input type="text" class="form-control" required autocomplete="off"  id="content_control">
                       </div>
                       <div class="form-group">
                          <label for="userid_control">User Id <strong class="text-danger">*</strong></label>
                           <select name="" id="userid_control" class="form-control">
                             <option value="1">1</option>
                             <option value="2">2</option>
                             <option value="3">3</option>
                             <option value="4">4</option>
                             <option value="5">5</option>
                             <option value="6">6</option>
                             <option value="7">7</option>
                             <option value="8">8</option>
                             <option value="9">9</option>
                             <option value="10">10</option>
                           </select>
                       </div>
                    </div>
                    <div class="card-footer bg-dark text-white">
                       <button class="btn btn-block btn-info" id="addpostbtn">Add Posts</button>
                       <button type="button" class=" d-none btn btn-block btn-warning" id="updatepostbtn">Update Posts</button>
                    </div>
                </div>
            </form>
           </div>
        </div>
    </div>
    <div class="container-fluid mt-3">
      <div class="row" id="post_container">
